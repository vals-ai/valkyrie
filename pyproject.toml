[project]
name = "valkyrie-cli"
version = "0.1.0"
description = "Valkyrie - An agentic harness that interfaces with benchmarks hosted by Vals AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
  "click>=8.1.0",
  "python-dotenv",
  "valkyrie-sdk>=0.34.0,<1",
  "pyyaml>=6.0.3",
  "textual>=8.2,<9",
]

[project.urls]
Documentation = "https://docs.valkyrie.vals.ai"
Repository = "https://github.com/vals-ai/Valkyrie"
Issues = "https://github.com/vals-ai/Valkyrie/issues"

[project.scripts]
valkyrie = "valkyrie.cli.entry:main"
valk = "valkyrie.cli.entry:main"

[dependency-groups]
dev = [
  "tracker",
  "httpx>=0.28.1",
  "check-wheel-contents>=0.6,<1",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "basedpyright",
  "packaging>=24,<26",
  "pyinstaller",
  "pytest-cov>=7.1.0",
  "twine>=6.2,<7",
  "sqlmodel>=0.0.38",
  "psycopg2-binary>=2.9.11",
  "alembic>=1.18.4",
  "datamodel-code-generator>=0.80,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath="."
venv=".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = false
reportTypedDictNotRequiredAccess = false
enableTypeIgnoreComments = true

include = [
  "src",
  "packages/valkyrie-sdk/src",
  "services/egress_proxy",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/valkyrie"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/valkyrie",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["description(text): what the test checks"]
pythonpath = [".", "services/tracker/src"]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["src/valkyrie"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 1
show_missing = true

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }
prerelease = "allow"

[tool.uv.workspace]
members = ["packages/valkyrie-sdk"]

[tool.uv.sources]
tracker = { path = "services/tracker", editable = true }
valkyrie-sdk = { workspace = true }
