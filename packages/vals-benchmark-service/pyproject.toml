[project]
name = "vals-benchmark-service"
version = "0.1.0"
description = "Vals hosted policy and lab-facing /v1 API for create-benchmark-service services"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "create-benchmark-service[vals-ai]",
    "cachetools>=5.5.0",
    "descope>=1.13.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "ruff>=0.15.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.61b0,<0.62",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vals_benchmark_service"]

[tool.uv.sources]
create-benchmark-service = { path = "../../packages/create-benchmark-service", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
exclude = [".*"]

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }
