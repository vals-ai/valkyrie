[project]
name = "tracker"
version = "0.1.0"
description = "Tracking service for agentic harness"
authors = [
  { name = "Omar Almatov", email = "52346350+oalmatov@users.noreply.github.com" },
]
requires-python = "==3.12.*"
dependencies = [
  "boto3>=1.42.20",
  "boto3-stubs[s3]",
  "cachetools>=7.1.1,<8",
  "fastapi[standard]>=0.135.3",
  "starlette>=1.0.1",
  "httpx>=0.28.1",
  "logfire[aiohttp-client,fastapi,httpx]>=3.0.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "cryptography>=44.0.0",
  "descope>=0.9.0",
  "tenacity>=9.0.0",
  "sentry-sdk[fastapi]==2.58.0",
  "python-json-logger>=3.2.1",
  "python-dotenv>=1.2.2",
  "create-benchmark-service>=0.39.1",
  "aioboto3>=7.0.0",
  "aiobotocore>=3.4.0",
  "modal>=1.6.4.dev2",
]

[dependency-groups]
database = [
  "sqlmodel>=0.0.38",
  "psycopg2-binary>=2.9.11",
  "alembic>=1.18.4",
]
dev = [
  "aws-cdk-lib==2.237.0",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "ruff",
  "basedpyright",
  "pytest-alembic>=0.12.1",
  "testcontainers[postgres]>=4.10.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }
prerelease = "allow"
default-groups = ["dev", "database"]
# Editable installs copy force-included executor_protocol.py and metric_process.py, so rebuild when they change.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/executor_protocol.py" }, { file = "src/metric_process.py" }]

[tool.uv.sources]
create-benchmark-service = { git = "https://github.com/vals-ai/create-benchmark-service.git", rev = "b2fe26bb6fb2acf5df4523df0178122562884b19" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.hatch.build.targets.wheel.force-include]
"src/executor_protocol.py" = "executor_protocol.py"
"src/metric_process.py" = "metric_process.py"

[tool.ruff]
line-length = 120
target-version = "py311"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["src", "../.."]

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true

exclude = [".venv", "src/tracker/database/migrations/versions"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["description(text): what the test checks"]
asyncio_mode = "auto"
pythonpath = [".", "src", "../.."]
[tool.coverage.run]
source = ["src/tracker", "main"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
