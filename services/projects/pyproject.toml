[project]
name = "projects"
version = "0.1.0"
description = "Valkyrie project service: the single owner of each project, its limit, its key secret and its total cost"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.1,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.1,<2",
  "httpx2>=2.16,<3",
  "pytest>=8,<10",
]

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["projects", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["description(text): what the test checks"]
